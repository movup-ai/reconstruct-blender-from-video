<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Blender Agent</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  .login { max-width:420px; margin:12vh auto 0; }
  .login .brand { display:flex; align-items:center; gap:10px; font-weight:650; font-size:18px; margin-bottom:22px; }
  .login .brand img { width:28px; height:28px; }
  .login form { display:flex; gap:8px; margin:14px 0 6px; }
  .login input { flex:1; min-width:0; }
  .members { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
</style>
</head>
<body>
<div class="wrap login">
  <div class="brand"><img src="/favicon.svg" alt=""> Blender Agent</div>
  <h1>Log in</h1>
  <p class="sub">Type your name. You see only your own source folder and your own clips. A new name makes a new member.</p>
  <form id="f"><label for="name" class="sr">Your name</label>
    <input type="text" id="name" autocomplete="username" spellcheck="false" maxlength="32" placeholder="e.g. anna" required>
    <button class="primary" type="submit">Log in</button></form>
  <p class="small bad" id="err" role="alert"></p>
  <div id="known" style="display:none"><p class="small muted" style="margin:18px 0 0">Members on this PC</p><div class="members" id="members"></div></div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
const next = (() => { const n = new URLSearchParams(location.search).get('next') || '/'; return n.startsWith('/') && !n.startsWith('//') ? n : '/'; })();
async function login(name) {
  $('err').textContent = '';
  const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { $('err').textContent = d.error || r.statusText; $('name').focus(); return; }
  location.href = next;
}
$('f').onsubmit = e => { e.preventDefault(); login($('name').value.trim()); };
fetch('/api/members').then(r => r.json()).then(d => {
  if (!d.members || !d.members.length) return;
  $('known').style.display = '';
  $('members').innerHTML = d.members.map(n => `<button type="button" data-n="${esc(n)}">${esc(n)}</button>`).join('');
  $('members').querySelectorAll('button').forEach(b => b.onclick = () => login(b.dataset.n));
}).catch(() => {});
$('name').focus();
</script>
</body>
</html>
