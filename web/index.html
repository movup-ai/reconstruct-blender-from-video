<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clips · Blender Agent</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="wrap">
  <div class="topline">
    <div><h1>Clips</h1><p class="sub">Clips in, checked submission zips out. Everything runs on this PC.</p></div>
    <div class="right"><a class="btn" href="/report.csv" title="Status of every clip as a spreadsheet">&#8681; Report</a><button id="quit" title="Stop Blender Agent">Quit</button></div>
  </div>
  <div class="banner fail" id="healthbanner" style="display:none"></div>

  <div class="hero">
    <div class="card">
      <div class="srcrow"><span class="lbl">Source folder</span><code id="srcpath" title="Videos are read from here. Results stay in the project's output, Work_auto and SUBMIT folders.">…</code>
        <button class="primary" id="pickfolder">&#128193; Choose source folder…</button></div>
      <div class="banner fail small" id="clashes" style="display:none;margin:8px 0 0"></div>
      <div class="rowsb" style="margin-top:12px"><b>Progress</b><span id="pct" class="muted"></span></div>
      <div class="bar" id="bar"></div>
      <div class="legend" id="legend"></div>
      <div class="auto">
        <span class="lbl">Autopilot</span>
        <span class="seg" id="autopilot"><button data-v="off">Off</button><button data-v="prepare">Prepare only</button><button data-v="full">Full auto</button></span>
      </div>
      <div class="muted small" id="autohint" style="margin-top:6px"></div>
      <div class="actions">
        <button id="prep">&#9654; Prepare all clips</button>
        <button class="primary" id="renderall" title="Fit, set, Blender, videos and the v2.1 zip for every reviewed clip. Clips unchanged since their last Finish are skipped.">&#9654; Finish all reviewed</button>
        <button id="retry">Retry failed</button>
        <button id="cancel">Clear queue</button>
      </div>
      <div class="q" id="queue"></div>
    </div>
    <div class="card">
      <div class="rowsb"><b>Add videos</b><button id="rescan" title="Look for videos copied into the Source folder by hand">&#8635; Rescan</button></div>
      <div class="row" style="margin:8px 0">
        <label>Film <select id="up_film"></select></label>
        <input type="text" id="up_new" placeholder="New film name" style="display:none;flex:1;min-width:160px">
      </div>
      <label class="drop" id="drop"><input type="file" id="up_files" accept="video/*,.mp4,.mov,.mkv,.avi,.m4v" multiple hidden>
        <b>Drop videos here</b> or click to choose<br><span class="small">mp4 · mov · mkv · avi. Added any time; prepared straight away when Autopilot is on.</span></label>
      <div id="up_list" class="uplist"></div>
    </div>
  </div>

  <div class="tabs"><span id="tabs" class="contents"></span><input class="search" id="search" placeholder="Search clips…" aria-label="Search clips"></div>
  <div id="list"><div class="empty">Loading…</div></div>
</div>
<div class="toast" id="toast"></div>
<script src="/static/common.js"></script>
<script>
nav('clips');
const GROUPS = [['ready', 'Needs review', '#f0b840'], ['busy', 'Working', '#5aa8f0'], ['conf', 'Reviewed', '#9fd8b0'],
                ['done', 'Finished', '#5cc27a'], ['fail', 'Failed', '#ef6464'], ['new', 'Not started', '#4a5059']];
const HINT = { off: 'Nothing starts on its own. Use the buttons, or review clips one by one.',
               prepare: 'Every clip is prepared with the local models, then waits for your review.',
               full: 'Every clip is prepared, checked by DeepSeek (if a key is saved), confirmed and rendered on its own. You can still open and fix any clip.' };
let FILTER = 'all', DATA = null;

function render() {
  const cnt = {}; DATA.clips.forEach(c => cnt[c.status.group] = (cnt[c.status.group] || 0) + 1);
  const t = $('tabs'); t.innerHTML = '';
  [['all', 'All', DATA.clips.length]].concat(GROUPS.map(g => [g[0], g[1], cnt[g[0]] || 0])).forEach(([k, l, n]) => {
    const b = el('button', { class: k === FILTER ? 'on' : '' }, `${l} (${n})`); b.onclick = () => { FILTER = k; render(); }; t.appendChild(b); });
  const total = DATA.clips.length || 1; $('bar').innerHTML = ''; $('legend').innerHTML = '';
  GROUPS.forEach(([k, l, col]) => { const n = cnt[k] || 0; if (!n) return;
    $('bar').appendChild(el('span', { style: `width:${100 * n / total}%;background:${col}`, title: `${l}: ${n}` }));
    $('legend').insertAdjacentHTML('beforeend', `<span><i style="background:${col}"></i>${l} ${n}</span>`); });
  $('pct').textContent = `${cnt.done || 0} of ${DATA.clips.length} finished`;
  const src = DATA.source; $('srcpath').textContent = src.path + (src.exists ? '' : '  (folder not found)');
  $('clashes').style.display = src.clashes.length ? '' : 'none';
  $('clashes').innerHTML = src.clashes.map(x => `<b>${esc(x.clip)}</b> is also the name of <code>${esc(x.other)}</code>, so this one was renamed with a short suffix.`).join('<br>');
  const nrev = DATA.clips.filter(c => c.status.confirmed && !c.status.done && c.status.fit).length;
  $('renderall').innerHTML = `&#9654; Finish all reviewed${nrev ? ` (${nrev})` : ''}`;
  const q = DATA.queue;
  segSet($('autopilot'), q.autopilot); $('autohint').textContent = HINT[q.autopilot] + (q.autopilot === 'full' && !DATA.ai_ready ? ' (No DeepSeek key, so roles follow simple rules.)' : '');
  $('queue').innerHTML = q.running || q.queued ? `<b>${q.running}</b> working, <b>${q.queued}</b> waiting · ${q.parallel} at once (<a href="/settings">change</a>)` +
     q.now.map(j => `<div style="margin-top:6px"><a href="/clip/${j.clip}">${esc(j.name.replace(/^[^_]+_/, ''))}</a> ${progressBar(j.progress, j.step)}</div>`).join('') : 'Nothing running.';
  const prog = {}; q.now.forEach(j => prog[j.clip] = j);
  const term = $('search').value.trim().toLowerCase(); const list = $('list'); list.innerHTML = ''; const films = {};
  DATA.clips.filter(c => (FILTER === 'all' || c.status.group === FILTER) && (!term || c.name.toLowerCase().includes(term)))
    .forEach(c => (films[c.film] = films[c.film] || []).push(c));
  if (!Object.keys(films).length) { list.innerHTML = `<div class="empty">${DATA.clips.length ? 'No clips here.' : 'No clips yet. Add videos above.'}</div>`; }
  for (const [film, cs] of Object.entries(films)) {
    list.insertAdjacentHTML('beforeend', `<h2>${esc(film)} · ${cs.length}</h2>`);
    const g = el('div', { class: 'grid' });
    cs.forEach(c => { const p = prog[c.id];
      g.insertAdjacentHTML('beforeend', `<a class="clip" href="/clip/${c.id}"><img loading="lazy" src="/media/clipthumb/${c.id}.jpg" alt="">
        <div class="t"><span class="n" title="${esc(c.name)}">${esc(c.name.replace(/^[^_]+_/, ''))}</span>${chip(c.status)}</div>
        <div class="small muted pk">${c.package ? esc(c.package) : '<span class="warn">no package name</span>'}</div>
        ${p && p.progress != null ? `<div class="pbar" title="${esc(p.step)}"><i style="width:${p.progress}%"></i></div>` : ''}</a>`); });
    list.appendChild(g);
  }
  films_();
}
async function load() { try { DATA = await api('/api/clips'); render(); } catch (e) { toast('Cannot reach Blender Agent: ' + e.message, true); } }
async function health() {
  try { const h = await api('/api/health'); const bad = h.checks.filter(c => !c.ok && !c.optional);
    $('healthbanner').style.display = bad.length ? 'block' : 'none';
    $('healthbanner').innerHTML = bad.length ? '✕ ' + bad.map(c => `<b>${esc(c.name)}</b>: ${esc(c.detail)}`).join(' · ') + ' (<a href="/settings">Settings</a>)' : '';
  } catch (e) {}
}
$('search').oninput = render;
segInit($('autopilot'), async v => { if (v === 'full' && !(await ask('Full auto renders every clip without waiting for you. Clips you already confirmed keep your choices. Turn it on?'))) { render(); return; }
  await post('/api/settings', { autopilot: v }); toast('Autopilot: ' + v); load(); });
$('prep').onclick = async () => { const r = await post('/api/prepare_all'); toast(`${r.queued} clip(s) added to the queue`); load(); };
$('renderall').onclick = async () => { const r = await post('/api/finish_reviewed');
  toast(`${r.queued} clip(s) queued to finish` + (r.unchanged ? ` · ${r.unchanged} unchanged since their last Finish, skipped` : '') +
        (r.no_name ? ` · ${r.no_name} without a package name` : '') + (r.busy ? ` · ${r.busy} already working` : ''), !!r.no_name); load(); };

// ---- source folder: Windows folder window (opened by the app), then the package names, then preparing starts
let PICK = null, PT = null;
$('pickfolder').onclick = async () => {
  $('pickfolder').disabled = true; toast('A folder window opened on this PC (it may be behind the browser).');
  let r; try { r = await post('/api/pick_folder'); } catch (e) { $('pickfolder').disabled = false; return; }
  $('pickfolder').disabled = false; if (!r.path) return;
  try { PICK = await api('/api/folder?path=' + encodeURIComponent(r.path)); } catch (e) { toast(e.message, true); return; }
  folderDialog();
};
function folderDialog() {
  const bg = el('div', { class: 'modal-bg', role: 'dialog', 'aria-modal': 'true' });
  bg.innerHTML = `<div class="modal wide"><h3 style="margin:0 0 6px">Use this folder?</h3><code>${esc(PICK.path)}</code>
    <p class="small muted">The videos stay where they are. Joints, work files and packages go to the project's output, Work_auto and SUBMIT folders.</p>
    <label style="display:flex;gap:8px;align-items:center">English title <input type="text" id="ftitle" style="flex:1" placeholder="e.g. the hidden blade" value="${esc(PICK.title)}"></label>
    <p class="small muted" id="fhint"></p><div class="ftable" id="ftable"></div>
    <div class="actions" style="justify-content:flex-end"><button class="m-no">Cancel</button><button class="primary m-yes">Use this folder and start preparing</button></div></div>`;
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.querySelector('.m-no').onclick = close; bg.onclick = e => { if (e.target === bg) close(); };
  const fill = () => {
    const v = PICK.videos, nw = v.filter(x => x.new_name).length;
    $('fhint').innerHTML = !v.length ? '<b class="bad">No videos in this folder.</b>' :
      `${v.length} video(s). ` + (PICK.unnamed ? `<b class="warn">${PICK.unnamed} still need a name: type the title above.</b>` :
      nw ? `${nw} new package name(s), numbered in file-name order after the ones already used for this title.` : 'Every video already has a package name.');
    $('ftable').innerHTML = `<table class="list"><thead><tr><th>Video</th><th>v2.1 package</th><th></th></tr></thead><tbody>` +
      v.map(x => `<tr><td>${esc(x.file)}</td><td>${x.package ? esc(x.package) + (x.new_name ? ' <span class="small good">new</span>' : '') : '<span class="muted">—</span>'}</td>
        <td class="small muted">${x.prepared ? 'prepared' : ''}</td></tr>`).join('') + '</tbody></table>' +
      (PICK.clashes.length ? `<p class="small warn">${PICK.clashes.length} video(s) share a name with a clip of another folder and get a short suffix.</p>` : '');
    bg.querySelector('.m-yes').disabled = !v.length || !!PICK.unnamed;
  };
  $('ftitle').oninput = () => { clearTimeout(PT); PT = setTimeout(async () => {
    PICK = await api(`/api/folder?path=${encodeURIComponent(PICK.path)}&title=${encodeURIComponent($('ftitle').value)}`); fill(); }, 300); };
  bg.querySelector('.m-yes').onclick = async () => {
    const r = await post('/api/use_folder', { path: PICK.path, title: $('ftitle').value }); close();
    toast(`${r.clips} video(s) · ${r.named} new package name(s) · ${r.queued} queued to prepare`); FILTER = 'all'; load(); };
  fill(); $('ftitle').focus();
}
$('retry').onclick = async () => { const r = await post('/api/retry_failed'); toast(`${r.queued} failed clip(s) queued again`); load(); };
$('cancel').onclick = async () => { if (!(await ask('Remove all waiting jobs from the queue? Running ones finish.'))) return; const r = await post('/api/cancel_queued'); toast(`${r.cancelled} waiting job(s) removed`); load(); };
$('quit').onclick = async () => { if (!(await ask('Stop Blender Agent? Unfinished jobs continue the next time you start it.'))) return; await post('/api/quit');
  document.body.innerHTML = '<div class="wrap"><h1>Blender Agent stopped</h1><p class="sub">Start it again with “Start Blender Agent.bat”.</p></div>'; };

// ---- add videos
function films_() {
  const sel = $('up_film'), cur = sel.value;
  const names = [...new Set(DATA.clips.map(c => c.film).filter(Boolean))];
  sel.innerHTML = names.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('') + '<option value="__new">+ New film…</option>';
  if (cur && [...sel.options].some(o => o.value === cur)) sel.value = cur;
  $('up_new').style.display = sel.value === '__new' ? '' : 'none';
}
$('up_film').onchange = () => { $('up_new').style.display = $('up_film').value === '__new' ? '' : 'none'; if ($('up_film').value === '__new') $('up_new').focus(); };
function uploadOne(file, film) {
  return new Promise(resolve => {
    const row = el('div', { class: 'uprow' });
    row.innerHTML = `<span class="n">${esc(file.name)}</span><span class="bar2"><i></i></span><span class="st muted">waiting</span>`;
    $('up_list').prepend(row);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `/api/upload?film=${encodeURIComponent(film)}&name=${encodeURIComponent(file.name)}`);
    xhr.upload.onprogress = e => { if (e.lengthComputable) { const p = 100 * e.loaded / e.total; row.querySelector('i').style.width = p + '%'; row.querySelector('.st').textContent = Math.round(p) + '%'; } };
    xhr.onload = () => { let d = {}; try { d = JSON.parse(xhr.responseText); } catch (e) {}
      const ok = xhr.status === 200; row.querySelector('.st').className = 'st ' + (ok ? 'good' : 'bad');
      row.querySelector('.st').textContent = ok ? `added as ${d.file}` : (d.error || 'failed'); if (ok) row.querySelector('i').style.width = '100%'; resolve(ok); };
    xhr.onerror = () => { row.querySelector('.st').className = 'st bad'; row.querySelector('.st').textContent = 'connection lost'; resolve(false); };
    xhr.send(file);
  });
}
async function uploadFiles(files) {
  const film = $('up_film').value === '__new' ? $('up_new').value.trim() : $('up_film').value;
  if (!film) { toast('Choose a film or type a new film name first', true); return; }
  files = [...files].filter(f => /\.(mp4|mov|mkv|avi|m4v)$/i.test(f.name));
  if (!files.length) { toast('No video files in that selection', true); return; }
  let ok = 0; for (const f of files) ok += await uploadOne(f, film) ? 1 : 0;
  toast(`${ok} of ${files.length} video(s) added to ${film}`); load();
}
$('up_files').onchange = e => { uploadFiles(e.target.files); e.target.value = ''; };
const drop = $('drop');
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => uploadFiles(e.dataTransfer.files));
$('rescan').onclick = async () => { const r = await post('/api/rescan'); toast(`${r.clips} clips · ${r.new} new`); load(); };

load(); health(); setInterval(load, 5000); setInterval(health, 60000);
</script>
</body>
</html>
